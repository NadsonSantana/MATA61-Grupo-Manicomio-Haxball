name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências (flex e bison)
        run: sudo apt-get update && sudo apt-get install -y flex bison

      - name: Rodar testes
        run: bash scripts/run_tests.sh
